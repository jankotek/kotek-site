<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
</head>
<body>
  <header id="header">
    <h1><a href="{{ get_url(path='/') }}"><img src="{{ get_url(path='img/blank.png') }}" alt=""></a> Jan <span>Kotek</span></h1>
  </header>

  <div id="container">
    <nav id="navcontainer" aria-label="Main navigation">
      <ul id="nav">
        <li id="nav-1"><a href="{{ get_url(path='/') }}">About me</a></li>
        <li><a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a></li>
        <li><a href="{{ get_url(path='@/consulting.md') }}">Consulting</a></li>
        <li><a href="{{ get_url(path='@/publications.md') }}">Publications</a></li>
        <li><a href="{{ get_url(path='@/contact.md') }}">Contact</a></li>
      </ul>
    </nav>

    <main id="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer id="footer">
    <div id="bottom">
      <div class="col3center">
        <h1>Profiles</h1>
        <div class="navlist">
          <ul>
            <li><a href="https://github.com/jankotek" title="Github">Github</a></li>
            <li><a href="https://www.linkedin.com/in/jan-kotek-3215552a" title="Linkedin">Linkedin</a></li>
          </ul>
        </div>
      </div>

      <div class="col3">
        <h1>Projects</h1>
        <div class="navlist">
          <ul>
            <li><a href="https://www.mapdb.org" title="MapDB">MapDB</a></li>
          </ul>
        </div>
      </div>

      <div class="col3">
        <h1>Site</h1>
        <div class="navlist">
          <ul>
            <li><a href="{{ get_url(path='/') }}" title="About me">About me</a></li>
            <li><a href="{{ get_url(path='@/blog/_index.md') }}" title="Blog">Blog</a></li>
            <li><a href="{{ get_url(path='@/consulting.md') }}" title="Consulting">Consulting</a></li>
            <li><a href="{{ get_url(path='@/contact.md') }}" title="Contact">Contact</a></li>
          </ul>
        </div>
      </div>

      <p>&copy; {{ now() | date(format='%Y') }} <a href="mailto:jan@kotek.net">Jan Kotek</a> | Design based on <a href="http://www.mitchinson.net">mitchinson</a></p>
    </div>
  </footer>
</body>
</html>
