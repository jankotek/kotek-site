when:
  - event: push
    branch: main

steps:
  build:
    image: ghcr.io/getzola/zola:v0.22.1
    entrypoint: [zola, build]

  deploy:
    image: alpine/git:latest
    environment:
      DEPLOY_KEY:
        from_secret: deploy_key
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - echo 'codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB' > ~/.ssh/known_hosts
      - ssh-keygen -F codeberg.org -f ~/.ssh/known_hosts >/dev/null
      - cd public
      - git init -q -b pages
      - git config user.email "ci@kotek.net"
      - git config user.name "kotek.net CI"
      - cp ../.domains .
      - git add -A
      - git commit -q -m "build $CI_COMMIT_SHA"
      - git remote add origin git@codeberg.org:jankotek/kotek-net.git
      - git push -f origin pages
